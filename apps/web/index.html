<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>HOOMA</title>
    <script>
      (() => {
        const storageKey = "hooma-web-appearance";
        const saved = window.localStorage.getItem(storageKey);
        const mode = saved === "dark" || saved === "light" || saved === "system" ? saved : "system";
        const resolved = mode === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : mode;
        document.documentElement.dataset.appearance = mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          const darkThemeColor = mode === "system" ? "#000000" : "#11110f";
          themeColor.setAttribute("content", resolved === "light" ? "#f6f4ee" : darkThemeColor);
        }
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
