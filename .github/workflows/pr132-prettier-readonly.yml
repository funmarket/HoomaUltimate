name: PR132 Prettier Readonly

on:
  push:
    branches:
      - tmp/pr132-prettier-readonly

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr132-prettier-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format PR132 files
        run: |
          npx prettier --write \
            packages/frontend/src/places/PlacesPages.tsx \
            tests/pitch-suggestion-lifecycle.integration.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/frontend/src/places/PlacesPages.tsx \
            tests/pitch-suggestion-lifecycle.integration.test.ts
          git commit -m "style: capture PR132 Prettier output"
          git push origin HEAD:tmp/pr132-prettier-readonly
