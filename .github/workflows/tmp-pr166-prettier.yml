name: PR 166 Prettier

on:
  push:
    branches:
      - fix/play-player-actions-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/play-player-actions-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format exact PR files
        run: >-
          npx prettier --write
          apps/api/src/modules/events/application/event.service.ts
          apps/api/src/modules/events/http/event.routes.ts
          apps/api/src/modules/play/application/play.repository.ts
          packages/frontend/src/events/PlayPage.tsx
          tests/event-player-invites.integration.test.ts
          tests/play-player-card-presentation.test.mjs
          tests/play-routes.test.mjs
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/modules/events/application/event.service.ts \
            apps/api/src/modules/events/http/event.routes.ts \
            apps/api/src/modules/play/application/play.repository.ts \
            packages/frontend/src/events/PlayPage.tsx \
            tests/event-player-invites.integration.test.ts \
            tests/play-player-card-presentation.test.mjs \
            tests/play-routes.test.mjs
          git commit -m "style(play): apply exact prettier output"
          git push origin HEAD:fix/play-player-actions-lifecycle
