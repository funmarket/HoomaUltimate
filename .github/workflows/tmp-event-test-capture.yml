name: Temporary Event Unit Capture

on:
  push:
    branches: [phase-0-foundation]
    paths:
      - ".github/workflows/tmp-event-test-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ultimate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hooma_ultimate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ultimate_test
      WEB_ORIGIN: http://localhost:5173
      TELEGRAM_ORIGIN: http://localhost:5174
      TELEGRAM_BOT_TOKEN: integration-test-token
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
      - run: npm run architecture:check
      - run: npm run typecheck
      - run: npm run build:packages
      - name: Capture only failing unit tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/event-unit-full.txt 2>&1
          code=$?
          {
            echo "EXIT_CODE=$code"
            echo "--- FAILING TAP BLOCKS ---"
            grep -n -B 4 -A 28 '^not ok ' /tmp/event-unit-full.txt || true
            echo "--- SUMMARY ---"
            tail -n 20 /tmp/event-unit-full.txt
          } > EVENT_UNIT_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin phase-0-foundation
          git add EVENT_UNIT_FAILURE.txt
          git commit -m "chore: capture compact event unit failures"
          git push origin HEAD:phase-0-foundation
