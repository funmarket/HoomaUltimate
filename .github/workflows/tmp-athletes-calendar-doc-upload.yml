name: tmp-athletes-calendar-doc-upload

on:
  push:
    branches:
      - tmp/athletes-calendar-doc-upload

permissions:
  contents: write

jobs:
  normalize-doc-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Athletes Calendar model block
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/CANONICAL_MODEL.md")
          text = path.read_text()
          replacements = {
              "  athletesCommunityIdcanonical AthletesCommunity": "  athletesCommunityId          canonical AthletesCommunity",
              "  startsAt UTC instant": "  startsAt                     UTC instant",
              "  endsAt   UTC instant; strictly after startsAt": "  endsAt                       UTC instant; strictly after startsAt",
              "  timezone valid IANA timezone captured at write time": "  timezone                     valid IANA timezone captured at write time",
              "  createdByUserId    canonical User; internal provenance": "  createdByUserId              canonical User; internal provenance",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected canonical-model anchor exactly once: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Commit normalized document blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CANONICAL_MODEL.md
          git diff --cached --check
          git commit -m "docs: normalize athletes calendar model formatting"
          git push origin HEAD:tmp/athletes-calendar-doc-upload
