name: tmp-athletes-calendar-doc-upload

on:
  push:
    branches:
      - tmp/athletes-calendar-doc-upload

permissions:
  contents: write

jobs:
  normalize-doc-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Athletes Calendar model block
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/CANONICAL_MODEL.md")
          text = path.read_text()
          old = '''AthletesCalendarEntry
  id
  athletesCommunityIdcanonical AthletesCommunity
  title
  description?
  location?
  startsAt UTC instant
  endsAt   UTC instant; strictly after startsAt
  timezone valid IANA timezone captured at write time
  cancelledAt?
  createdByUserId    canonical User; internal provenance
  createdAt
  updatedAt'''
          new = '''AthletesCalendarEntry
  id
  athletesCommunityId          canonical AthletesCommunity
  title
  description?
  location?
  startsAt                     UTC instant
  endsAt                       UTC instant; strictly after startsAt
  timezone                     valid IANA timezone captured at write time
  cancelledAt?
  createdByUserId              canonical User; internal provenance
  createdAt
  updatedAt'''
          if text.count(old) != 1:
              raise SystemExit(f"expected malformed Calendar model block once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

      - name: Commit normalized document blob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CANONICAL_MODEL.md
          git diff --cached --check
          git commit -m "docs: normalize athletes calendar model formatting"
          git push origin HEAD:tmp/athletes-calendar-doc-upload
