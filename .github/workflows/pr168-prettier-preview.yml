name: PR168 Prettier Preview

on:
  pull_request:
    branches:
      - phase-0-foundation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write apps/api/src/modules/places/boundary/canonical-place.persistence.ts
          git diff -- apps/api/src/modules/places/boundary/canonical-place.persistence.ts || true
