name: Place image resolution finalize

on:
  push:
    branches:
      - fix/place-external-image-resolution-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/place-external-image-resolution-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Document canonical Place photo-link behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('requirements.md')
          text = path.read_text()
          marker = '## 11.1 Place suggestion\n'
          addition = '''## 11.0.1 External Place photo links\n\nPlace photo inputs may be direct image URLs or public web/share/result URLs that resolve to a specific image. HOOMA resolves supported public redirects and page image metadata into the existing canonical `PlaceImage` URL before persistence. Google image-result/search links may resolve to an explicit result image when one is present in the returned result document. Unresolvable links must fail clearly rather than persist an HTML page as an image URL.\n\nExternal resolution must reject private/internal network targets and revalidate redirects so Place media cannot become an SSRF path. Spot, Watch and Pitch continue to read the same canonical Place media rather than owning parallel photo stores.\n\n'''
          if addition not in text:
              if marker not in text:
                  raise SystemExit('Canonical Places insertion point moved; refusing to guess')
              text = text.replace(marker, addition + marker, 1)
              path.write_text(text)
          PY
      - name: Apply repository formatter
        run: |
          npx prettier --write \
            apps/api/src/bootstrap/container.ts \
            apps/api/src/modules/pitch/application/pitch-suggestion.service.ts \
            apps/api/src/modules/places/application/external-place-image-resolver.ts \
            apps/api/src/modules/places/application/place.service.ts \
            apps/api/src/modules/places/infrastructure/http-external-place-image-resolver.ts \
            tests/external-place-image-resolver.test.ts \
            requirements.md
      - name: Remove temporary workflow
        run: rm .github/workflows/place-image-resolution-finalize.yml
      - name: Commit finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/bootstrap/container.ts \
            apps/api/src/modules/pitch/application/pitch-suggestion.service.ts \
            apps/api/src/modules/places/application/external-place-image-resolver.ts \
            apps/api/src/modules/places/application/place.service.ts \
            apps/api/src/modules/places/infrastructure/http-external-place-image-resolver.ts \
            tests/external-place-image-resolver.test.ts \
            requirements.md \
            .github/workflows/place-image-resolution-finalize.yml
          git commit -m "docs(places): define external photo resolution"
          git push origin HEAD:fix/place-external-image-resolution-v2
