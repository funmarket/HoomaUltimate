name: Temporary Watch formatter

on:
  push:
    branches:
      - fix/watch-cultural-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/watch-cultural-prettier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Watch finishing files
        run: |
          npx prettier --write \
            apps/api/src/modules/events/infrastructure/prisma-event.repository.ts \
            packages/contracts/src/index.ts \
            packages/frontend/src/events/CreateEventPage.tsx \
            packages/frontend/src/events/WatchEventForm.tsx \
            packages/frontend/src/events/api.ts \
            packages/frontend/src/places/PlaceDetailPage.tsx \
            packages/frontend/src/places/PlaceForm.tsx \
            packages/frontend/src/watch/CulturalEventCard.tsx \
            packages/frontend/src/watch/WatchPage.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/modules/events/infrastructure/prisma-event.repository.ts \
            packages/contracts/src/index.ts \
            packages/frontend/src/events/CreateEventPage.tsx \
            packages/frontend/src/events/WatchEventForm.tsx \
            packages/frontend/src/events/api.ts \
            packages/frontend/src/places/PlaceDetailPage.tsx \
            packages/frontend/src/places/PlaceForm.tsx \
            packages/frontend/src/watch/CulturalEventCard.tsx \
            packages/frontend/src/watch/WatchPage.tsx
          git commit -m "style(watch): apply repository formatting"
          git push origin HEAD:fix/watch-cultural-prettier
