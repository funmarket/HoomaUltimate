name: Temp format helper

on:
  push:
    branches:
      - feat/requests-athletes-projection-v2

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/requests/infrastructure/prisma-request.repository.ts packages/frontend/src/athletes/AthletesRequestsPane.tsx
      - name: Emit formatted files
        run: |
          echo "REPO_START"
          base64 -w0 apps/api/src/modules/requests/infrastructure/prisma-request.repository.ts
          echo
          echo "REPO_END"
          echo "PANE_START"
          base64 -w0 packages/frontend/src/athletes/AthletesRequestsPane.tsx
          echo
          echo "PANE_END"
