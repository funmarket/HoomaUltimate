name: Action Boundary Verify

on:
  push:
    branches: [fix/action-boundary-account-provisioning]
  pull_request:
    branches: [phase-0-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ultimate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hooma_ultimate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ultimate_test
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:5173
      TELEGRAM_ORIGIN: http://localhost:5174
      TELEGRAM_BOT_TOKEN: integration-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - name: Format only action-boundary files in the ephemeral runner
        run: >-
          npx prettier --write
          apps/api/src/modules/identity/application/identity.repository.ts
          apps/api/src/modules/identity/application/identity.service.ts
          apps/api/src/modules/identity/http/identity.public.routes.ts
          apps/api/src/modules/identity/infrastructure/prisma-identity.repository.ts
          apps/web/src/app/router/HoomaRouter.tsx
          apps/web/src/auth/TelegramAccountActivationPage.tsx
          docs/AUTH.md
          docs/GAMERS_PRODUCT_CONTRACT.md
          packages/frontend/src/context.tsx
          packages/frontend/src/gamers/GamersPage.tsx
          tests/identity.http.integration.test.ts
          tests/identity.service.test.ts
      - name: Archive exact formatted copies
        run: >-
          tar -czf /tmp/action-boundary-formatted.tgz
          apps/api/src/modules/identity/application/identity.repository.ts
          apps/api/src/modules/identity/application/identity.service.ts
          apps/api/src/modules/identity/http/identity.public.routes.ts
          apps/api/src/modules/identity/infrastructure/prisma-identity.repository.ts
          apps/web/src/app/router/HoomaRouter.tsx
          apps/web/src/auth/TelegramAccountActivationPage.tsx
          docs/AUTH.md
          docs/GAMERS_PRODUCT_CONTRACT.md
          packages/frontend/src/context.tsx
          packages/frontend/src/gamers/GamersPage.tsx
          tests/identity.http.integration.test.ts
          tests/identity.service.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: action-boundary-formatted
          path: /tmp/action-boundary-formatted.tgz
          if-no-files-found: error
      - name: Lint touched source
        run: >-
          npx eslint
          apps/api/src/modules/identity/application/identity.repository.ts
          apps/api/src/modules/identity/application/identity.service.ts
          apps/api/src/modules/identity/http/identity.public.routes.ts
          apps/api/src/modules/identity/infrastructure/prisma-identity.repository.ts
          apps/web/src/app/router/HoomaRouter.tsx
          apps/web/src/auth/TelegramAccountActivationPage.tsx
          packages/frontend/src/context.tsx
          packages/frontend/src/gamers/GamersPage.tsx
          tests/identity.http.integration.test.ts
          tests/identity.service.test.ts
          --max-warnings=0
      - run: npm run typecheck
      - run: npm run build:packages
      - name: Identity service unit proof
        run: npx tsx --test tests/identity.service.test.ts
      - name: Identity PostgreSQL HTTP proof
        run: npx tsx --test --test-concurrency=1 tests/identity.http.integration.test.ts
