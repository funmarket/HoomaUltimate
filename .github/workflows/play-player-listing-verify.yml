name: Play Player Listing Verify

on:
  push:
    branches: [feat/play-player-looking]
  pull_request:
    branches: [phase-0-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ultimate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hooma_ultimate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ultimate_test
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:5173
      TELEGRAM_ORIGIN: http://localhost:5174
      TELEGRAM_BOT_TOKEN: integration-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
      - run: npm run architecture:check
      - name: Check Play slice formatting
        continue-on-error: true
        run: >-
          npx prettier --check
          apps/api/src/bootstrap/container.ts
          apps/api/src/http/public-v1/router.ts
          apps/api/src/http/v1/router.ts
          apps/api/src/modules/play/**/*.ts
          apps/web/src/main.tsx
          packages/contracts/package.json
          packages/contracts/src/play.ts
          packages/frontend/package.json
          packages/frontend/src/events/PlayPage.tsx
          packages/frontend/src/events/play-api.ts
          packages/frontend/src/events/play-player-listing.css
          tests/play-player-listing.integration.test.ts
          .github/workflows/play-player-listing-verify.yml
      - name: Prepare exact Prettier output
        run: |
          mkdir -p formatted/apps/web/src
          mkdir -p formatted/packages/contracts
          mkdir -p formatted/packages/frontend/src/events
          mkdir -p formatted/packages/frontend
          mkdir -p formatted/tests
          npx prettier apps/web/src/main.tsx > formatted/apps/web/src/main.tsx
          npx prettier packages/contracts/package.json > formatted/packages/contracts/package.json
          npx prettier packages/frontend/package.json > formatted/packages/frontend/package.json
          npx prettier packages/frontend/src/events/PlayPage.tsx > formatted/packages/frontend/src/events/PlayPage.tsx
          npx prettier tests/play-player-listing.integration.test.ts > formatted/tests/play-player-listing.integration.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: play-prettier-output
          path: formatted
      - name: Lint changed TypeScript
        run: >-
          npx eslint --max-warnings=0
          apps/api/src/bootstrap/container.ts
          apps/api/src/http/public-v1/router.ts
          apps/api/src/http/v1/router.ts
          apps/api/src/modules/play/**/*.ts
          apps/web/src/main.tsx
          packages/contracts/src/play.ts
          packages/frontend/src/events/PlayPage.tsx
          packages/frontend/src/events/play-api.ts
      - run: npm run typecheck
      - run: npm run build:packages
      - name: Play PostgreSQL integration proof
        run: npx tsx --test tests/play-player-listing.integration.test.ts
      - run: npm run build:apps
      - run: npm run db:migrate:status
