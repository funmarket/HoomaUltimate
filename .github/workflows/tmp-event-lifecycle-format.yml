name: Temporary Event Lifecycle Formatter

on:
  push:
    branches: [phase-0-foundation]
    paths:
      - ".github/workflows/tmp-event-lifecycle-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Apply lifecycle follow-ups
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path("apps/api/src/modules/events/infrastructure/prisma-event.repository.ts")
          text = repo.read_text()
          old = '["CONFIRMED", "WAITLISTED", "ATTENDED"]'
          new = '["CONFIRMED", "WAITLISTED", "ATTENDED", "NO_SHOW"]'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 private Play access status lists, found {count}")
          repo.write_text(text.replace(old, new))

          page = Path("packages/frontend/src/events/EventDetailPage.tsx")
          text = page.read_text()
          old = '{rsvp === "CONFIRMED" ? "✓ RSVP · " : "Attendance · "}'
          new = '{rsvp === "ATTENDED" || rsvp === "NO_SHOW"\n                ? "Attendance · "\n                : rsvp === "CONFIRMED"\n                  ? "✓ RSVP · "\n                  : "RSVP · "}'
          if old not in text:
              raise SystemExit("EventDetail RSVP prefix target not found")
          page.write_text(text.replace(old, new))

          canonical = Path("docs/CANONICAL_MODEL.md")
          text = canonical.read_text()
          text = text.replace("  checkedInAt?\n", "")
          old = "Current statuses must support at least confirmed/waitlisted/cancelled/attended/no-show semantics required by implemented behavior.\n\nRules:\n\n- one canonical RSVP per Event/User;"
          new = "Current statuses support reservation state and finalized attendance outcome: `CONFIRMED`, `WAITLISTED`, `CANCELLED`, `ATTENDED`, and `NO_SHOW`. Check-in is not an RSVP status.\n\nRules:\n\n- one canonical RSVP per Event/User;\n- during an active Play Event, a checked-in participant remains `CONFIRMED` while independent `EventCheckIn` evidence exists;\n- Play Event completion finalizes checked-in confirmed participants as `ATTENDED` and unchecked confirmed participants as `NO_SHOW`;"
          if old not in text:
              raise SystemExit("canonical RSVP block target not found")
          text = text.replace(old, new)
          old = "Rules:\n\n- one check-in per Event/User;\n- check-in authorization and timing follow Event service policy;\n- no public leakage of precise private location beyond intended product behavior."
          new = "Rules:\n\n- one check-in per Event/User;\n- `EventCheckIn.createdAt` is the authoritative first check-in timestamp;\n- repeated check-in preserves the first check-in evidence;\n- current check-in policy is Play-specific and requires a `PUBLISHED` Play Event plus a `CONFIRMED` RSVP; Watch does not inherit Play check-in through generic Event plumbing;\n- no authoritative numeric opening/closing offset exists today, so no arbitrary check-in timing constant is part of the model;\n- check-in never finalizes attendance; Play completion owns the `ATTENDED` / `NO_SHOW` transition;\n- no public leakage of precise private location beyond intended product behavior."
          if old not in text:
              raise SystemExit("canonical check-in block target not found")
          canonical.write_text(text.replace(old, new))
          PY
      - name: Format lifecycle files
        run: >-
          npx prettier --write
          apps/api/src/modules/events/application/event.service.ts
          apps/api/src/modules/events/infrastructure/prisma-event.repository.ts
          packages/frontend/src/events/EventDetailPage.tsx
          tests/event-service.test.ts
          tests/events.integration.test.ts
          docs/CANONICAL_MODEL.md
      - name: Commit formatted lifecycle repair and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-event-lifecycle-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/events/application/event.service.ts \
                  apps/api/src/modules/events/infrastructure/prisma-event.repository.ts \
                  packages/frontend/src/events/EventDetailPage.tsx \
                  tests/event-service.test.ts \
                  tests/events.integration.test.ts \
                  docs/CANONICAL_MODEL.md
          git commit -m "fix(events): reconcile lifecycle follow-ups and formatting"
          git push origin HEAD:phase-0-foundation
