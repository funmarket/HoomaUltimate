name: PR 131 Prettier

on:
  push:
    branches:
      - feat/game-pitch-location

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-pitch-location
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed source files
        run: >-
          npx prettier --write
          apps/api/src/bootstrap/container.ts
          apps/api/src/modules/events/application/event.service.ts
          packages/frontend/src/game-location/GameLocationPicker.tsx
          packages/frontend/src/teams/CoachControlRoomPage.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/bootstrap/container.ts apps/api/src/modules/events/application/event.service.ts packages/frontend/src/game-location/GameLocationPicker.tsx packages/frontend/src/teams/CoachControlRoomPage.tsx
          git commit -m "style: apply Prettier to game location slice"
          git push origin HEAD:feat/game-pitch-location
