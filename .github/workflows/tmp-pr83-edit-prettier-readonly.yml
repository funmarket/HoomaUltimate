name: tmp-pr83-edit-prettier-readonly

on:
  push:
    branches:
      - feat/community-privacy-media-final

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx prettier --write packages/frontend/src/communities/HoomaEditPage.tsx
      - run: git diff --no-ext-diff --unified=4 -- packages/frontend/src/communities/HoomaEditPage.tsx
