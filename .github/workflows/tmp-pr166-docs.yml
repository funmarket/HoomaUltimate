name: PR 166 Canonical Docs

on:
  push:
    branches:
      - fix/play-player-actions-lifecycle

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/play-player-actions-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Update canonical Play action contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          requirements = Path('requirements.md')
          text = requirements.read_text()
          anchor = '- absence of Team/Community membership must never block this Play discovery action.\n'
          addition = '''\nDirect player actions from this feed preserve owning-domain authority:\n\n- for a `TEAM` listing, Play resolves the current listing owner and hands the canonical target User to Teams; the selected Team must be one the actor can manage for roster actions, and Teams alone authorizes and persists the canonical `TeamPlayerOffer`;\n- for a `GAME` listing, Play resolves the current listing owner and hands the canonical target User to Events; the selected Event must be a `PUBLISHED` `PLAY` Event the actor can manage under the existing Event organizer policy;\n- sending a Game invitation never creates or changes an RSVP; Events owns the durable `EventPlayerInvite`;\n- only the invited User may accept or decline an Event invitation; acceptance uses the same canonical, row-locked Event RSVP capacity/waitlist transaction as ordinary Join;\n- cancelling or completing an Event closes its pending player invitations;\n- pending Team offers and Event invitations are read back from their owning domains and mapped to Play listing IDs server-side; browser-local “sent” flags are not lifecycle authority;\n- public Play listing projections do not expose canonical target User IDs merely to support these actions.\n'''
          if addition.strip() not in text:
              if anchor not in text:
                  raise SystemExit('requirements anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
              requirements.write_text(text)

          canonical = Path('docs/CANONICAL_MODEL.md')
          text = canonical.read_text()
          anchor = '- PlayPlayerListing does not create Event, Team, Community, GamerProfile, or shadow membership records.\n\n---\n\n# 12. PlayEventDetails\n'
          addition = '''- PlayPlayerListing does not create Event, Team, Community, GamerProfile, or shadow membership records.\n\n## TeamPlayerOffer recruitment handoff\n\n`TeamPlayerOffer` remains a Teams-owned durable lifecycle even when the action begins on the Play Players feed.\n\n```text\nTeamPlayerOffer\n  id\n  teamId\n  targetUserId\n  offeredByUserId\n  message?\n  status             PENDING | ACCEPTED | DECLINED\n  createdAt\n  respondedAt?\n  updatedAt\n```\n\nRules:\n\n- Play resolves a current `TEAM` PlayPlayerListing to its canonical target User and passes that target through a narrow application boundary; Teams infrastructure must not query Play-owned persistence directly;\n- Teams authorizes the actor with its canonical `MANAGE_ROSTER` policy and owns offer persistence;\n- one canonical offer identity exists per Team/target User and resend reuses that identity according to Team lifecycle policy;\n- acceptance creates or reactivates the canonical TeamPlayer through Teams; decline does not create roster membership;\n- Play persists no duplicate offer state and public Play discovery never exposes target User IDs for this workflow.\n\n## EventPlayerInvite\n\nGame invitations are Events-owned durable state reached through Play discovery orchestration.\n\n```text\nEventPlayerInvite\n  id\n  eventId\n  targetUserId\n  invitedByUserId\n  status             PENDING | ACCEPTED | DECLINED | CANCELLED\n  createdAt\n  respondedAt?\n  updatedAt\n```\n\nRules:\n\n- one canonical invitation identity exists per Event/target User;\n- Play resolves only a current `GAME` PlayPlayerListing and passes the canonical target User to Events through a narrow application boundary;\n- only a manager authorized by the existing Event management policy may invite, and only to a `PUBLISHED` `PLAY` Event;\n- sending an invitation never creates an RSVP;\n- only the target User may accept or decline;\n- acceptance and RSVP allocation occur in one transaction using the same row-locked capacity/waitlist policy as ordinary Event Join;\n- Event cancellation or completion closes pending invitations as `CANCELLED`;\n- Play persists no duplicate invitation state and maps owning-domain pending records back to current listing IDs only for authenticated action readback.\n\n---\n\n# 12. PlayEventDetails\n'''
          if '## EventPlayerInvite\n' not in text:
              if anchor not in text:
                  raise SystemExit('canonical anchor not found')
              text = text.replace(anchor, addition, 1)
              canonical.write_text(text)
          PY
      - run: npx prettier --write requirements.md docs/CANONICAL_MODEL.md
      - name: Commit canonical docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.md docs/CANONICAL_MODEL.md
          git commit -m "docs(play): lock player action ownership"
          git push origin HEAD:fix/play-player-actions-lifecycle
