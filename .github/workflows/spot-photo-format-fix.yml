name: Spot photo format fix

on:
  push:
    branches:
      - fix/spot-photo-full-contain

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spot-photo-full-contain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format regression test
        run: npx prettier --write tests/place-card-photo-fit.test.mjs
      - name: Remove temporary workflow
        run: rm .github/workflows/spot-photo-format-fix.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/place-card-photo-fit.test.mjs .github/workflows/spot-photo-format-fix.yml
          git commit -m "style(places): format Spot photo regression test"
          git push origin HEAD:fix/spot-photo-full-contain
