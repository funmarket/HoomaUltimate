name: Prettier Discovery Debug

on:
  pull_request:
    paths:
      - "apps/api/src/modules/discovery/application/discovery.repository.ts"
      - ".github/workflows/prettier-discovery-debug.yml"

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write apps/api/src/modules/discovery/application/discovery.repository.ts
          git diff -- apps/api/src/modules/discovery/application/discovery.repository.ts
