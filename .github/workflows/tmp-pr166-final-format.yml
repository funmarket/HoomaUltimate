name: PR 166 Final Format

on:
  push:
    branches:
      - fix/play-player-actions-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/play-player-actions-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx prettier --write tests/event-player-invites.integration.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/event-player-invites.integration.test.ts
          git commit -m "style(events): format completion invite coverage"
          git push origin HEAD:fix/play-player-actions-lifecycle
