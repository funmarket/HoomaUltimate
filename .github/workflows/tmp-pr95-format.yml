name: Temporary PR95 format diagnostic

on:
  push:
    branches:
      - feat/gamers-home-discovery-onboarding

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print formatted integration test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr95/tests
          cp tests/gamers.integration.test.ts /tmp/pr95/tests/gamers.integration.test.ts
          npx prettier --config .prettierrc.json --write /tmp/pr95/tests/gamers.integration.test.ts
          echo FORMAT_BEGIN
          base64 -w0 /tmp/pr95/tests/gamers.integration.test.ts
          echo
          echo FORMAT_END
