name: Temporary PR72 Prettier

on:
  push:
    branches:
      - tmp/pr72-prettier

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr72-prettier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx prettier --write apps/web/src/telegram/runtime.ts
      - name: Commit exact Prettier output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/telegram/runtime.ts
          git diff --cached --quiet || git commit -m "style: apply exact prettier output"
          git push origin HEAD:tmp/pr72-prettier
