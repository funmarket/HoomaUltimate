name: Temporary Event Test Diagnose

on:
  push:
    branches: [phase-0-foundation]
    paths:
      - ".github/workflows/tmp-event-test-diagnose.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ultimate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hooma_ultimate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ultimate_test
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:5173
      TELEGRAM_ORIGIN: http://localhost:5174
      TELEGRAM_BOT_TOKEN: integration-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - name: Capture unit failure
        shell: bash
        run: |
          set +e
          npm test > /tmp/event-unit.log 2>&1
          code=$?
          tail -n 240 /tmp/event-unit.log > EVENT_UNIT_FAILURE.txt
          printf '\nEXIT_CODE=%s\n' "$code" >> EVENT_UNIT_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EVENT_UNIT_FAILURE.txt
          git commit -m "chore: capture event lifecycle unit failure"
          git push origin HEAD:phase-0-foundation
