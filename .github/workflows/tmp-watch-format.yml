name: Temporary Watch formatter

on:
  push:
    branches:
      - fix/watch-clean-places-events

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/watch-clean-places-events
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Watch cleanup files
        run: |
          npx prettier --write \
            apps/api/src/modules/events/infrastructure/prisma-event.repository.ts \
            apps/web/src/admin/AdminApp.tsx \
            packages/contracts/src/platform-management.ts \
            packages/frontend/src/events/CreateEventPage.tsx \
            packages/frontend/src/events/EventDetailPage.tsx \
            packages/frontend/src/places/PlaceCapabilityOnboarding.tsx \
            packages/frontend/src/places/PlacesPages.tsx \
            packages/frontend/src/places/platform-management-api.ts \
            packages/frontend/src/watch/WatchPage.tsx \
            packages/frontend/src/watch/watch.css \
            tests/platform-owner-places.integration.test.ts \
            tests/watch-canonical-place-structure.test.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/events/infrastructure/prisma-event.repository.ts apps/web/src/admin/AdminApp.tsx packages/contracts/src/platform-management.ts packages/frontend/src/events/CreateEventPage.tsx packages/frontend/src/events/EventDetailPage.tsx packages/frontend/src/places/PlaceCapabilityOnboarding.tsx packages/frontend/src/places/PlacesPages.tsx packages/frontend/src/places/platform-management-api.ts packages/frontend/src/watch/WatchPage.tsx packages/frontend/src/watch/watch.css tests/platform-owner-places.integration.test.ts tests/watch-canonical-place-structure.test.mjs
          git commit -m "style(watch): apply repository formatter"
          git push origin HEAD:fix/watch-clean-places-events
