name: Temporary Place Detail Formatter

on:
  push:
    branches: [fix/place-detail-watch-experience]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/place-detail-watch-experience
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format only CI-flagged Place detail files
        run: npx prettier --write packages/frontend/src/places/PlaceDetailPage.tsx packages/frontend/src/ui/HoomaIcons.tsx
      - name: Remove temporary formatter and commit formatted sources
        run: |
          rm .github/workflows/tmp-place-detail-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/frontend/src/places/PlaceDetailPage.tsx packages/frontend/src/ui/HoomaIcons.tsx .github/workflows/tmp-place-detail-format.yml
          git commit -m "style(places): format Place detail sources"
          git push origin HEAD:fix/place-detail-watch-experience
