name: PR159 exact Prettier

on:
  push:
    branches: [tmp/pr159-prettier-exact]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-157-source-recovery
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin repository npm version
        run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format exact stale-test migrations
        run: |
          npm exec -- prettier --write tests/spots-provenance.test.mjs tests/watch-canonical-place-structure.test.mjs
          git diff --check
          if git diff --exit-code --quiet; then
            echo "No formatting changes produced"
            exit 1
          fi
          git config user.name "Out Of Sight"
          git config user.email "33332777+funmarket@users.noreply.github.com"
          git add tests/spots-provenance.test.mjs tests/watch-canonical-place-structure.test.mjs
          git commit -m "test: apply exact prettier output to post-157 migrations"
          git push origin HEAD:fix/post-157-source-recovery
