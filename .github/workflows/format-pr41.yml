name: Format PR41

on:
  push:
    branches:
      - feat/team-player-offers

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: run one-off formatter'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format remaining PR41 files
        run: >-
          npx prettier --write
          apps/api/src/modules/teams/application/team.service.ts
          apps/api/src/modules/teams/http/team.routes.ts
          packages/frontend/src/events/PlayPlayerCard.tsx
          packages/frontend/src/teams/TeamOffersPanel.tsx
          packages/frontend/src/teams/team-offer-api.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/teams/application/team.service.ts \
            apps/api/src/modules/teams/http/team.routes.ts \
            packages/frontend/src/events/PlayPlayerCard.tsx \
            packages/frontend/src/teams/TeamOffersPanel.tsx \
            packages/frontend/src/teams/team-offer-api.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "chore: format remaining Hire Player files"
            git push origin HEAD:feat/team-player-offers
          fi
