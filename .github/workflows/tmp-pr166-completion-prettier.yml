name: PR166 completion prettier

on:
  push:
    branches: [tmp/pr166-completion-prettier]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr166-completion-prettier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Print exact Prettier output
        run: |
          file=tests/event-player-invites.integration.test.ts
          npm exec -- prettier --write "$file"
          echo "===== BEGIN FILE ====="
          cat "$file"
          echo "===== END FILE ====="
