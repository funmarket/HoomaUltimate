name: G3 Reconcile Foundation

on:
  push:
    branches: [feat/gamers-human-match-system]
    paths: [.github/workflows/g3-reconcile-foundation.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gamers-human-match-system
          fetch-depth: 0
      - name: Merge current foundation without rewriting history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin phase-0-foundation
          if ! git merge --no-ff --no-edit origin/phase-0-foundation; then
            echo "MERGE_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "MERGE_CONFLICTS_END"
            exit 1
          fi
          git push origin HEAD:feat/gamers-human-match-system
