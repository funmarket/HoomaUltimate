name: PR67 exact prettier

on:
  push:
    branches:
      - tmp/pr67-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr67-prettier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx prettier --write apps/web/src/admin/AdminApp.tsx
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/admin/AdminApp.tsx
          git commit -m "chore: apply exact Prettier output for PR 67"
          git push origin HEAD:tmp/pr67-prettier
