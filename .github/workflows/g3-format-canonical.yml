name: G3 Format Canonical

on:
  push:
    branches: [feat/gamers-human-match-system]
    paths: [.github/workflows/g3-format-canonical.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gamers-human-match-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx prettier --write docs/CANONICAL_MODEL.md
      - name: Persist formatting
        run: |
          if git diff --quiet -- docs/CANONICAL_MODEL.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CANONICAL_MODEL.md
          git commit -m "docs(gamers): format G3 canonical model"
          git push origin HEAD:feat/gamers-human-match-system
