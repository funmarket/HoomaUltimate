name: CI

on:
  push:
    branches: [tmp/pr153-prettier-exact]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin repository npm version
        run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Print exact Prettier output for PR 153
        run: |
          npm exec -- prettier --write apps/api/src/modules/places/infrastructure/prisma-place.repository.ts packages/contracts/src/events.ts
          git diff -- apps/api/src/modules/places/infrastructure/prisma-place.repository.ts packages/contracts/src/events.ts
          exit 1
