name: CI

on:
  push:
    branches: [tmp/pr153-prettier-exact]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/place-provenance-canonical-identity-v2
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin repository npm version
        run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Align Pitch integration with canonical Place result
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "tests/pitch-suggestion-lifecycle.integration.test.ts";
          let source = await readFile(path, "utf8");
          const oldSource = '    placeId = suggested.id;\n    assert.equal(suggested.status, "PENDING");';
          const newSource = '    assert.equal(suggested.outcome, "CREATED");\n    placeId = suggested.place.id;\n    assert.equal(suggested.status, "PENDING");';
          if (!source.includes(oldSource)) throw new Error("stale Pitch suggestion result usage not found");
          source = source.replace(oldSource, newSource);
          await writeFile(path, source);
          NODE
          npm exec -- prettier --write tests/pitch-suggestion-lifecycle.integration.test.ts
          git diff --check
          git diff --exit-code --quiet && exit 0
          git config user.name "Out Of Sight"
          git config user.email "33332777+funmarket@users.noreply.github.com"
          git add tests/pitch-suggestion-lifecycle.integration.test.ts
          git commit -m "test(pitch): consume canonical Place suggestion result"
          git push origin HEAD:fix/place-provenance-canonical-identity-v2
