name: CI

on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin repository npm version
        run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Print exact Prettier output for Pitch ticket
        run: |
          npm exec -- prettier --write packages/frontend/src/pitch/PitchTicket.tsx
          git diff -- packages/frontend/src/pitch/PitchTicket.tsx
          exit 1
