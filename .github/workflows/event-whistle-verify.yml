name: Event Whistle Verify

on:
  push:
    branches: [feat/play-event-whistle]
  pull_request:
    branches: [phase-0-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ultimate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hooma_ultimate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ultimate_test
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:5173
      TELEGRAM_ORIGIN: http://localhost:5174
      TELEGRAM_BOT_TOKEN: integration-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
      - run: npm run architecture:check
      - name: Check Event Whistle formatting
        run: >-
          npx prettier --check
          apps/api/src/bootstrap/container.ts
          apps/api/src/modules/events/application/event.service.ts
          apps/api/src/modules/whistle/application/whistle.service.ts
          packages/frontend/src/api.ts
          packages/frontend/src/events/EventDetailPage.tsx
          packages/frontend/src/whistle/HoomaWhistleBoard.tsx
          tests/event-whistle.integration.test.ts
          docs/CANONICAL_MODEL.md
          docs/DECISIONS.md
          docs/adr/ADR-042-event-whistle-context.md
          .github/workflows/event-whistle-verify.yml
      - name: Lint Event Whistle TypeScript
        run: >-
          npx eslint --max-warnings=0
          apps/api/src/bootstrap/container.ts
          apps/api/src/modules/events/application/event.service.ts
          apps/api/src/modules/whistle/application/whistle.service.ts
          packages/frontend/src/api.ts
          packages/frontend/src/events/EventDetailPage.tsx
          packages/frontend/src/whistle/HoomaWhistleBoard.tsx
          tests/event-whistle.integration.test.ts
      - run: npm run typecheck
      - run: npm run build:packages
      - name: Event Whistle PostgreSQL and Redis proof
        run: npx tsx --test tests/event-whistle.integration.test.ts
      - name: Community Whistle regression proof
        run: npx tsx --test tests/whistle.integration.test.ts
      - run: npm run build:apps
      - run: npm run db:migrate:status
