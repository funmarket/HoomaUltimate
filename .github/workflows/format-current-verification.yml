name: Verification format helper

on:
  push:
    branches:
      - fix/current-verification-baseline

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Apply repository Prettier
        run: npm exec -- prettier --write tests/light-appearance-authority.test.mjs
      - name: Commit exact output
        run: |
          if git diff --quiet -- tests/light-appearance-authority.test.mjs; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/light-appearance-authority.test.mjs
          git commit -m "style(test): apply repository prettier output"
          git push origin HEAD:fix/current-verification-baseline
