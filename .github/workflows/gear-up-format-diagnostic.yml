name: Gear Up format diagnostic

on:
  pull_request:
    paths:
      - "packages/contracts/src/gear-up.ts"
      - ".github/workflows/gear-up-format-diagnostic.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/contracts/src/gear-up.ts
      - run: git diff -- packages/contracts/src/gear-up.ts
