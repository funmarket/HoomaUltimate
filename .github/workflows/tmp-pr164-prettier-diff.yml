name: PR164 prettier diff

on:
  push:
    branches: [tmp/pr164-prettier-diff]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr164-prettier-diff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npm exec -- prettier --write apps/api/src/bootstrap/container.ts apps/web/src/profile/UserWhistlePanel.tsx packages/frontend/src/profile-api.ts tests/user-direct-whistle.integration.test.ts
          git diff --check
          git diff -- apps/api/src/bootstrap/container.ts apps/web/src/profile/UserWhistlePanel.tsx packages/frontend/src/profile-api.ts tests/user-direct-whistle.integration.test.ts
