name: tmp-pr85-prettier-readonly

on:
  push:
    branches:
      - tmp/pr85-prettier-readonly

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format flagged file
        run: npx prettier --write tests/event-whistle.integration.test.ts
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/event-whistle.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture PR85 prettier output"
            git push
          fi
