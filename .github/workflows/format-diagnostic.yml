name: Format diagnostic

on:
  push:
    branches:
      - fix/gamer-hud-whistle-cleanup

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print formatted CSS without modifying source
        shell: bash
        run: |
          set -euo pipefail
          file=packages/frontend/src/gamers/gamers.css
          mkdir -p /tmp/hooma-format/packages/frontend/src/gamers
          cp "$file" "/tmp/hooma-format/$file"
          npx prettier --config .prettierrc.json --write "/tmp/hooma-format/$file"
          echo "FORMATTED_CSS_BASE64_BEGIN"
          base64 -w0 "/tmp/hooma-format/$file"
          echo
          echo "FORMATTED_CSS_BASE64_END"
