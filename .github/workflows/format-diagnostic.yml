name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Show Coach Control Room Prettier diff
        run: npx prettier packages/frontend/src/teams/CoachControlRoomPage.tsx | diff -u packages/frontend/src/teams/CoachControlRoomPage.tsx - || true
      - name: Show Teams CSS Prettier diff
        run: npx prettier packages/frontend/src/teams/teams.css | diff -u packages/frontend/src/teams/teams.css - || true
