name: Temporary PR122 Prettier

on:
  push:
    branches:
      - tmp/pr122-prettier-exact

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/api/src/modules/events/infrastructure/prisma-event.repository.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/events/infrastructure/prisma-event.repository.ts
          git commit -m "style(tmp): apply exact Prettier output"
          git push
