name: Temporary Watch Place formatter preview

on:
  push:
    branches:
      - fix/watch-place-visual-readability

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Format changed text files without mutating repository
        run: |
          npx prettier --write \
            packages/frontend/src/ui/FitSingleLineText.tsx \
            packages/frontend/src/watch/WatchTicket.tsx \
            packages/frontend/src/watch/watch.css \
            packages/frontend/src/places/PlaceDetailPage.tsx \
            packages/frontend/src/places/places.css \
            tests/watch-ticket-final-presentation.test.mjs \
            tests/watch-canonical-place-structure.test.mjs \
            tests/place-detail-watch-experience.test.mjs \
            tests/watch-ticket-asset.test.mjs
      - name: Print exact formatter diff
        run: |
          git diff -- \
            packages/frontend/src/ui/FitSingleLineText.tsx \
            packages/frontend/src/watch/WatchTicket.tsx \
            packages/frontend/src/watch/watch.css \
            packages/frontend/src/places/PlaceDetailPage.tsx \
            packages/frontend/src/places/places.css \
            tests/watch-ticket-final-presentation.test.mjs \
            tests/watch-canonical-place-structure.test.mjs \
            tests/place-detail-watch-experience.test.mjs \
            tests/watch-ticket-asset.test.mjs
      - name: Require exact formatter output
        run: |
          git diff --quiet -- \
            packages/frontend/src/ui/FitSingleLineText.tsx \
            packages/frontend/src/watch/WatchTicket.tsx \
            packages/frontend/src/watch/watch.css \
            packages/frontend/src/places/PlaceDetailPage.tsx \
            packages/frontend/src/places/places.css \
            tests/watch-ticket-final-presentation.test.mjs \
            tests/watch-canonical-place-structure.test.mjs \
            tests/place-detail-watch-experience.test.mjs \
            tests/watch-ticket-asset.test.mjs
