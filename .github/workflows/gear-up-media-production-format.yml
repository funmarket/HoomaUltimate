name: Gear Up media production formatter diagnostic

on:
  pull_request:
    paths:
      - "apps/api/src/modules/gear-up/application/gear-up-product-media.repository.ts"
      - "apps/api/src/modules/gear-up/application/gear-up-product-media.service.ts"
      - "apps/api/src/modules/gear-up/application/gear-up-settings.service.ts"
      - "apps/api/src/modules/gear-up/infrastructure/prisma-gear-up-product-media.repository.ts"
      - "packages/contracts/src/gear-up.ts"
      - ".github/workflows/gear-up-media-production-format.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          apps/api/src/modules/gear-up/application/gear-up-product-media.repository.ts
          apps/api/src/modules/gear-up/application/gear-up-product-media.service.ts
          apps/api/src/modules/gear-up/application/gear-up-settings.service.ts
          apps/api/src/modules/gear-up/infrastructure/prisma-gear-up-product-media.repository.ts
          packages/contracts/src/gear-up.ts
      - run: >
          git diff --
          apps/api/src/modules/gear-up/application/gear-up-product-media.repository.ts
          apps/api/src/modules/gear-up/application/gear-up-product-media.service.ts
          apps/api/src/modules/gear-up/application/gear-up-settings.service.ts
          apps/api/src/modules/gear-up/infrastructure/prisma-gear-up-product-media.repository.ts
          packages/contracts/src/gear-up.ts
