name: Temporary gamers format diagnostic

on:
  push:
    branches:
      - feat/gamers-home-discovery-onboarding

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Prettier diffs without modifying source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/api/src/modules/gamers/http/gamer.routes.ts
            apps/api/src/modules/identity/application/identity.service.ts
            packages/frontend/src/gamers/GamerGamePage.tsx
            packages/frontend/src/gamers/GamersPage.tsx
            packages/frontend/src/gamers/gamers-home.css
            tests/gamer-challenger-card-presentation.test.mjs
            tests/gamers.integration.test.ts
          )
          rm -rf /tmp/hooma-format
          for file in "${files[@]}"; do
            mkdir -p "/tmp/hooma-format/$(dirname "$file")"
            cp "$file" "/tmp/hooma-format/$file"
          done
          npx prettier --config .prettierrc.json --write "${files[@]/#//tmp/hooma-format/}"
          for file in "${files[@]}"; do
            echo "FORMAT_DIFF_BEGIN:$file"
            diff -u "$file" "/tmp/hooma-format/$file" || true
            echo "FORMAT_DIFF_END:$file"
          done
