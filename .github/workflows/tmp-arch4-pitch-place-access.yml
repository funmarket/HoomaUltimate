name: ARCH4 Pitch Place Access Exact

on:
  push:
    branches:
      - tmp/arch4-pitch-place-access

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ultimate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hooma_ultimate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ultimate_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin repository npm version
        run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate:deploy
      - name: Check ARCH-4 candidate formatting
        run: |
          npm exec -- prettier --check \
            apps/api/src/modules/pitch/application/pitch-place-access.ts \
            apps/api/src/modules/pitch/application/pitch-owner.service.ts \
            apps/api/src/bootstrap/container.ts \
            tests/pitch-owner-management.integration.test.ts \
            tests/pitch-suggestion-lifecycle.integration.test.ts \
            tests/pitch-moderation-concurrency.integration.test.ts
      - run: npm run architecture:check
      - run: npm run typecheck
      - run: npm run build:packages
      - name: Run focused Pitch tests
        run: |
          npm exec -- tsx --test \
            tests/pitch-owner-management.integration.test.ts \
            tests/pitch-suggestion-lifecycle.integration.test.ts \
            tests/pitch-moderation-concurrency.integration.test.ts
