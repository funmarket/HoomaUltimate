name: Unit failure summary

on:
  pull_request:
    branches:
      - fix/current-verification-baseline

permissions:
  contents: read

jobs:
  unit-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run db:generate
      - name: Capture exact assertion failures
        run: |
          set +e
          npm test > unit.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "--- account loading failure ---"
            sed -n '1,335p' unit.log
            echo "--- router failure ---"
            sed -n '840,1090p' unit.log
          } > unit-failure-summary.txt
          cat unit-failure-summary.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: unit-failure-summary
          path: unit-failure-summary.txt
          if-no-files-found: error
