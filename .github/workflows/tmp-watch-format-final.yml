name: Temporary Watch final formatter

on:
  push:
    branches:
      - fix/watch-clean-places-events

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/watch-clean-places-events
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final Watch verification files
        run: |
          npx prettier --write \
            packages/frontend/src/places/PlacesPages.tsx \
            packages/frontend/src/watch/WatchTicket.tsx \
            tests/watch-canonical-place-structure.test.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/frontend/src/places/PlacesPages.tsx packages/frontend/src/watch/WatchTicket.tsx tests/watch-canonical-place-structure.test.mjs
          git commit -m "style(watch): format final verification files"
          git push origin HEAD:fix/watch-clean-places-events
