name: Gear Up media test formatter diagnostic

on:
  pull_request:
    paths:
      - "tests/gear-up-product-media.integration.test.ts"
      - "tests/gear-up-product-media.service.test.ts"
      - ".github/workflows/gear-up-media-test-format.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          tests/gear-up-product-media.integration.test.ts
          tests/gear-up-product-media.service.test.ts
      - run: >
          git diff --
          tests/gear-up-product-media.integration.test.ts
          tests/gear-up-product-media.service.test.ts
