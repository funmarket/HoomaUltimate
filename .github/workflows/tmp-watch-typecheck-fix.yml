name: Temporary Watch typecheck fix

on:
  push:
    branches:
      - fix/watch-clean-places-events

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/watch-clean-places-events
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Apply narrow type-boundary fixes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          function replaceOnce(path, before, after) {
            const source = readFileSync(path, "utf8");
            if (!source.includes(before)) throw new Error(`Expected source not found in ${path}`);
            const updated = source.replace(before, after);
            if (updated === source) throw new Error(`No change made in ${path}`);
            writeFileSync(path, updated);
          }

          const eventRepo = "apps/api/src/modules/events/infrastructure/prisma-event.repository.ts";
          replaceOnce(
            eventRepo,
            "const publicEventSelect = {",
            "const publicEventSelect = Prisma.validator<Prisma.EventSelect>()({",
          );
          replaceOnce(
            eventRepo,
            "} as const;\n\nexport class PrismaEventRepository",
            "});\n\ntype PublicEventRow = Prisma.EventGetPayload<{ select: typeof publicEventSelect }>;\n\nexport class PrismaEventRepository",
          );
          replaceOnce(
            eventRepo,
            `function serializePublicEvent(event: {\n  createdByUserId: string;\n  place: null | {\n    ownerships: { userId: string }[];\n    [key: string]: unknown;\n  };\n  [key: string]: unknown;\n}) {`,
            "function serializePublicEvent(event: PublicEventRow) {",
          );

          const playPage = "packages/frontend/src/events/PlayPage.tsx";
          replaceOnce(
            playPage,
            `{events.map((event) => (\n              <PickupMatchCard\n                key={event.id}\n                title={event.title}\n                dateLabel={formatDate(event.startsAt)}\n                venueName={event.venueName || event.address}\n                communityName={event.community.name}\n                goingCount={event._count.rsvps}\n                capacity={event.capacity}\n                format={event.playDetails?.format ?? null}\n                href={\`/events/\${event.id}\`}\n              />\n            ))}`,
            `{events.map((event) => {\n              if (!event.community) return null;\n              return (\n                <PickupMatchCard\n                  key={event.id}\n                  title={event.title}\n                  dateLabel={formatDate(event.startsAt)}\n                  venueName={event.venueName || event.address}\n                  communityName={event.community.name}\n                  goingCount={event._count.rsvps}\n                  capacity={event.capacity}\n                  format={event.playDetails?.format ?? null}\n                  href={\`/events/\${event.id}\`}\n                />\n              );\n            })}`,
          );
          NODE
      - name: Format touched source
        run: |
          npx prettier --write \
            apps/api/src/modules/events/domain/event-error.ts \
            apps/api/src/modules/events/infrastructure/prisma-event.repository.ts \
            apps/api/src/modules/discovery/infrastructure/prisma-discovery.repository.ts \
            apps/api/src/modules/places/infrastructure/prisma-place-capability.repository.ts \
            packages/frontend/src/events/PlayPage.tsx
      - run: npm run typecheck
      - name: Commit verified fixes and remove helper
        run: |
          rm .github/workflows/tmp-watch-typecheck-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(watch): align nullable Event boundaries"
          git push origin HEAD:fix/watch-clean-places-events
