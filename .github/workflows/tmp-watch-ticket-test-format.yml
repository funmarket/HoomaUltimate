name: Temporary Watch ticket test formatter

on:
  push:
    branches:
      - fix/watch-ticket-mobile-typography

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/watch-ticket-mobile-typography
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx prettier --write tests/watch-canonical-place-structure.test.mjs tests/watch-ticket-final-presentation.test.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/watch-canonical-place-structure.test.mjs tests/watch-ticket-final-presentation.test.mjs
          git commit -m "style(watch): apply repository formatter to ticket tests"
          git push origin HEAD:fix/watch-ticket-mobile-typography
